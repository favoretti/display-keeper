name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SIGN_IDENTITY: "Developer ID Application: Vladimir Lazarenko (9U27PZQ2N8)"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: swift test

      - name: Import signing certificate and notary key
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          kc=$RUNNER_TEMP/signing.keychain-db
          kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$kc"
          rm "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: VERSION=${GITHUB_REF_NAME#v} NOTARY_PROFILE=notary scripts/build-app.sh

      - name: Generate appcast
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          mkdir appcast && cp dist/*.zip appcast/
          echo "$SPARKLE_ED_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" appcast

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip appcast/appcast.xml --generate-notes

      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          version=${GITHUB_REF_NAME#v}
          sha=$(shasum -a 256 "dist/DisplayKeeper-$version.zip" | cut -d' ' -f1)
          eval "$(ssh-agent -s)"
          echo "$TAP_DEPLOY_KEY" | ssh-add -
          git clone git@github.com:favoretti/homebrew-tap.git tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$version/" -e "s/__SHA256__/$sha/" packaging/homebrew/display-keeper.rb > tap/Casks/display-keeper.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/display-keeper.rb
          git commit -m "display-keeper $version"
          git push
